<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1000 280"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0d14"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1035"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".7"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".8"/></linearGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="pulse-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".8"/><stop offset="100%" stop-color="#4facfe" stop-opacity=".8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="soft-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseCircle{0%{r:4px;opacity:.3}50%{r:8px;opacity:.9}}@keyframes dashMove{0%{stroke-dashoffset:100}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes bgGlow{0%{opacity:.4}50%{opacity:.7}}.node-pulse-1{animation:pulseCircle 3s infinite ease-in-out}.node-pulse-2{animation:pulseCircle 4s infinite ease-in-out 1s}.node-pulse-3{animation:pulseCircle 3.5s infinite ease-in-out .5s}.stream-line{stroke-dasharray:8 6;animation:dashMove 12s linear infinite}.pill-box{animation:floatPill 4s infinite ease-in-out}.glow-bg-orb{animation:bgGlow 6s infinite ease-in-out}.pill-text,.subtitle-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,H